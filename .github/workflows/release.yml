name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.21'
  BINARY_NAME: pertisk-chart

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
            cc: gcc
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            cc: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binaries with static linking
        run: |
          # Use Debian-based image with glibc for SQLite3 compatibility
          # SQLite3 requires glibc features (pread64/pwrite64) not available in musl
          # We use dynamic linking for glibc but static linking for other libraries
          # For CGO cross-compilation, we build on the target platform to use native compiler
          PLATFORM="linux/${{ matrix.goarch }}"
          BINARY_NAME="${{ env.BINARY_NAME }}"
          
          # Create a Dockerfile for better caching
          # Build on target platform to get native compiler (slower but more reliable for CGO)
          cat > Dockerfile.build << DOCKERFILE
          FROM golang:1.21-bookworm AS base
          RUN apt-get update && \
              apt-get install -y --no-install-recommends gcc libc6-dev && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          
          # Cache Go modules
          COPY go.mod go.sum ./
          RUN --mount=type=cache,target=/go/pkg/mod \
              go mod download
          
          # Copy source
          COPY . .
          
          # Build binaries (using native compiler for the target platform)
          ARG BINARY_NAME
          RUN mkdir -p /out
          RUN --mount=type=cache,target=/root/.cache/go-build \
              --mount=type=cache,target=/go/pkg/mod \
              CGO_ENABLED=1 \
              go build -a -buildvcs=false -ldflags='-s -w' -tags 'osusergo netgo' \
              -o /out/\${BINARY_NAME}-linux-\$(go env GOARCH) ./cmd/server && \
              CGO_ENABLED=1 \
              go build -a -buildvcs=false -ldflags='-s -w' -tags 'osusergo netgo' \
              -o /out/pertisk-chart-create-admin-linux-\$(go env GOARCH) ./cmd/create-admin
          
          FROM scratch AS export
          COPY --from=base /out /
          DOCKERFILE
          
          # Build with GitHub Actions cache
          # Using target platform ensures native compiler is available
          docker buildx build \
            --platform $PLATFORM \
            --output type=local,dest=. \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg BINARY_NAME=$BINARY_NAME \
            -f Dockerfile.build \
            .
          
          # Verify binaries were created
          ls -lh $BINARY_NAME-linux-${{ matrix.goarch }} pertisk-chart-create-admin-linux-${{ matrix.goarch }}
          
          # Cleanup temporary Dockerfile
          rm -f Dockerfile.build

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Create package directories
        run: |
          mkdir -p pkg/usr/bin
          mkdir -p pkg/etc/pertisk-chart
          mkdir -p pkg/var/lib/pertisk-chart
          mkdir -p pkg/var/log/pertisk-chart
          mkdir -p pkg/lib/systemd/system
          mkdir -p pkg/usr/share/pertisk-chart
          
          cp ${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }} pkg/usr/bin/${{ env.BINARY_NAME }}
          chmod +x pkg/usr/bin/${{ env.BINARY_NAME }}
          
          # Copy create-admin binary
          cp pertisk-chart-create-admin-linux-${{ matrix.goarch }} pkg/usr/bin/pertisk-chart-create-admin
          chmod +x pkg/usr/bin/pertisk-chart-create-admin
          
          # Copy web files
          cp -r web pkg/usr/share/pertisk-chart/

      - name: Create systemd service file
        run: |
          cat > pkg/lib/systemd/system/pertisk-chart.service << 'EOF'
          [Unit]
          Description=Pertisk Helm Chart Repository Server
          After=network.target
          
          [Service]
          Type=simple
          User=pertisk-chart
          Group=pertisk-chart
          ExecStart=/usr/bin/pertisk-chart \
            --port=7080 \
            --data-dir=/var/lib/pertisk-chart \
            --storage-local-rootdir=/var/lib/pertisk-chart/chartstorage
          Restart=always
          RestartSec=5
          LimitNOFILE=65535
          
          # Allow binding to privileged ports if needed
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          
          # Security hardening
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/pertisk-chart /var/log/pertisk-chart
          PrivateTmp=true
          
          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Create config file
        run: |
          cat > pkg/etc/pertisk-chart/config.conf << 'EOF'
          # Pertisk Chart Repository Configuration
          # See documentation for all available options
          
          # Server port
          PORT=7080
          
          # Data directory
          DATA_DIR=/var/lib/pertisk-chart
          
          # Storage root directory
          STORAGE_ROOT=/var/lib/pertisk-chart/chartstorage
          
          # Database type (sqlite, postgres, file)
          DB_TYPE=sqlite
          
          # Database DSN (for SQLite: file path, for PostgreSQL: connection string)
          # DB_DSN=/var/lib/pertisk-chart/users.db
          EOF

      - name: Create pre/post install scripts
        run: |
          # Pre-install script
          cat > preinstall.sh << 'EOF'
          #!/bin/sh
          set -e
          
          # Create pertisk-chart user and group if they don't exist
          if ! getent group pertisk-chart >/dev/null 2>&1; then
              groupadd --system pertisk-chart
          fi
          
          if ! getent passwd pertisk-chart >/dev/null 2>&1; then
              useradd --system --gid pertisk-chart --home-dir /var/lib/pertisk-chart \
                  --shell /usr/sbin/nologin --comment "Pertisk Helm Chart Repository" pertisk-chart
          fi
          EOF
          
          # Post-install script
          cat > postinstall.sh << 'EOF'
          #!/bin/sh
          set -e
          
          # Set proper permissions
          chown -R pertisk-chart:pertisk-chart /var/lib/pertisk-chart
          chown -R pertisk-chart:pertisk-chart /var/log/pertisk-chart
          chmod 750 /var/lib/pertisk-chart
          chmod 750 /var/log/pertisk-chart
          
          # Create chartstorage directory if it doesn't exist
          mkdir -p /var/lib/pertisk-chart/chartstorage
          chown pertisk-chart:pertisk-chart /var/lib/pertisk-chart/chartstorage
          chmod 750 /var/lib/pertisk-chart/chartstorage
          
          # Set permissions on web directory (read-only for service user)
          if [ -d /usr/share/pertisk-chart/web ]; then
              chown -R root:root /usr/share/pertisk-chart/web
              chmod -R 755 /usr/share/pertisk-chart/web
          fi
          
          # Grant capability to bind to privileged ports if needed
          if command -v setcap >/dev/null 2>&1; then
              setcap 'cap_net_bind_service=+ep' /usr/bin/pertisk-chart
              echo "Granted network binding capability to pertisk-chart binary"
          else
              echo "Warning: setcap not found. Install libcap2-bin (Debian/Ubuntu) or libcap (RHEL/CentOS)"
              echo "Then run: sudo setcap 'cap_net_bind_service=+ep' /usr/bin/pertisk-chart"
          fi
          
          # Reload systemd
          if command -v systemctl >/dev/null 2>&1; then
              systemctl daemon-reload
              echo ""
              echo "Pertisk Chart Repository has been installed successfully!"
              echo ""
              echo "IMPORTANT: Create an admin user before starting the service:"
              echo "  sudo pertisk-chart-create-admin \\"
              echo "    -username admin \\"
              echo "    -email admin@example.com \\"
              echo "    -password your-secure-password \\"
              echo "    -data-dir /var/lib/pertisk-chart \\"
              echo "    -db-type sqlite"
              echo ""
              echo "Then start the service:"
              echo "  sudo systemctl start pertisk-chart"
              echo ""
              echo "To enable on boot:"
              echo "  sudo systemctl enable pertisk-chart"
              echo ""
              echo "To check status:"
              echo "  sudo systemctl status pertisk-chart"
              echo ""
          fi
          EOF
          
          # Pre-remove script
          cat > preremove.sh << 'EOF'
          #!/bin/sh
          set -e
          
          # Stop service if running
          if command -v systemctl >/dev/null 2>&1; then
              if systemctl is-active --quiet pertisk-chart; then
                  systemctl stop pertisk-chart
              fi
              if systemctl is-enabled --quiet pertisk-chart 2>/dev/null; then
                  systemctl disable pertisk-chart
              fi
          fi
          EOF
          
          chmod +x preinstall.sh postinstall.sh preremove.sh

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n ${{ env.BINARY_NAME }} \
            -v ${{ steps.version.outputs.VERSION }} \
            -a ${{ matrix.deb_arch }} \
            --description "Helm Chart Repository Server with Web UI" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "Pertisk Team" \
            --license "MIT" \
            --vendor "Pertisk" \
            --category "net" \
            --depends libcap2-bin \
            --before-install preinstall.sh \
            --after-install postinstall.sh \
            --before-remove preremove.sh \
            --config-files /etc/pertisk-chart/config.conf \
            --directories /var/lib/pertisk-chart \
            --directories /var/log/pertisk-chart \
            --directories /usr/share/pertisk-chart \
            --deb-systemd-enable \
            --deb-no-default-config-files \
            -C pkg \
            .

      - name: Build RPM package
        run: |
          fpm -s dir -t rpm \
            -n ${{ env.BINARY_NAME }} \
            -v ${{ steps.version.outputs.VERSION }} \
            -a ${{ matrix.rpm_arch }} \
            --description "Helm Chart Repository Server with Web UI" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "Pertisk Team" \
            --license "MIT" \
            --vendor "Pertisk" \
            --category "System Environment/Daemons" \
            --depends libcap \
            --depends shadow-utils \
            --before-install preinstall.sh \
            --after-install postinstall.sh \
            --before-remove preremove.sh \
            --config-files /etc/pertisk-chart/config.conf \
            --directories /var/lib/pertisk-chart \
            --directories /var/log/pertisk-chart \
            --directories /usr/share/pertisk-chart \
            --rpm-os linux \
            -C pkg \
            .

      - name: Create tarball
        run: |
          tar -czvf ${{ env.BINARY_NAME }}-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.goarch }}.tar.gz \
            -C pkg/usr/bin ${{ env.BINARY_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.goarch }}
          path: |
            *.deb
            *.rpm
            *.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "=== Listing packages directory ==="
          ls -laR packages/ || echo "packages directory not found"
          echo "=== Current directory ==="
          ls -la

      - name: Generate checksums
        run: |
          cd packages
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.tar.gz
            packages/SHA256SUMS.txt
          body: |
            ## Installation

            ### Debian/Ubuntu (amd64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/pertisk-chart_${{ steps.version.outputs.VERSION }}_amd64.deb
            sudo dpkg -i pertisk-chart_${{ steps.version.outputs.VERSION }}_amd64.deb
            ```

            ### Debian/Ubuntu (arm64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/pertisk-chart_${{ steps.version.outputs.VERSION }}_arm64.deb
            sudo dpkg -i pertisk-chart_${{ steps.version.outputs.VERSION }}_arm64.deb
            ```

            ### RHEL/CentOS/AlmaLinux (x86_64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/pertisk-chart-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            sudo rpm -i pertisk-chart-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            ```

            ### RHEL/CentOS/AlmaLinux (aarch64)
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/pertisk-chart-${{ steps.version.outputs.VERSION }}-1.aarch64.rpm
            sudo rpm -i pertisk-chart-${{ steps.version.outputs.VERSION }}-1.aarch64.rpm
            ```

            ### Binary (manual installation)
            Download the appropriate tarball for your architecture and extract it:
            ```bash
            tar -xzf pertisk-chart-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            sudo mv pertisk-chart /usr/local/bin/
            ```

            ## Post Installation

            ### Create Admin User
            Before starting the service, create an admin user:
            ```bash
            sudo pertisk-chart-create-admin \
              -username admin \
              -email admin@example.com \
              -password your-secure-password \
              -data-dir /var/lib/pertisk-chart \
              -db-type sqlite
            ```

            For PostgreSQL:
            ```bash
            sudo pertisk-chart-create-admin \
              -username admin \
              -email admin@example.com \
              -password your-secure-password \
              -db-type postgres \
              -db-dsn "host=localhost user=postgres password=secret dbname=pertisk port=5432 sslmode=disable"
            ```

            ### Start Service
            ```bash
            # Start the service
            sudo systemctl start pertisk-chart

            # Enable on boot
            sudo systemctl enable pertisk-chart

            # Check status
            sudo systemctl status pertisk-chart
            ```

            ## Configuration
            The service runs on port 7080 by default. Configuration file is located at:
            `/etc/pertisk-chart/config.conf`

            Charts are stored in:
            `/var/lib/pertisk-chart/chartstorage`

            ## Verify Checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
