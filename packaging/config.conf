# Pertisk Chart Repository Configuration
# This file is sourced by the systemd service.
# After changes: sudo systemctl restart pertisk-chart

# Server port
PORT=7080

# Data directory (users database, etc.)
DATA_DIR=/var/lib/pertisk-chart

# Chart storage root directory
STORAGE_ROOT=/var/lib/pertisk-chart/chartstorage

# Database type: sqlite, postgres, or file
DB_TYPE=sqlite

# Database DSN
# SQLite file path (default: $DATA_DIR/users.db)
# PostgreSQL: host=localhost user=postgres password=secret dbname=pertisk port=5432 sslmode=disable
# DB_DSN=/var/lib/pertisk-chart/users.db

# JWT secret (or set JWT_SECRET in the environment)
# JWT_SECRET=

# Optional flags (true/false)
# ENABLE_METRICS=false
# DEBUG=false
# ENABLE_HTTP3=false
# ENABLE_ZSTD=true

# TLS (required when ENABLE_HTTP3=true)
# TLS_CERT=/etc/pertisk-chart/tls/cert.pem
# TLS_KEY=/etc/pertisk-chart/tls/key.pem
